[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-agent"
version = "0.1.0"
description = "A free, local-first, open-source agent that joins meetings, transcribes them, and extracts insights for interviews and paper discussions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.3",     # local speech-to-text (MIT)
    "playwright>=1.44",          # browser automation for joining meetings (Apache-2.0)
    "cryptography>=42",          # encryption at rest (Apache-2.0/BSD)
    "pyyaml>=6",
    "pypdf>=4",                  # read the paper being discussed (BSD)
    "sounddevice>=0.4.6",        # local mic / loopback capture (MIT)
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Speaker diarization. Free, but the pyannote models require accepting their
# licence on Hugging Face and a (free) read token. Runs fully offline afterwards.
diarize = ["pyannote.audio>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meeting_agent"]
